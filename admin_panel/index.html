<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Gate</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Texts come from js/locales/*.js via data-i18n* attributes (see js/i18n.js). -->

  <!-- ============ Login ============ -->
  <section id="login-view" class="login" hidden>
    <form id="login-form" class="login__card">
      <div class="login__head">
        <h1 data-i18n="app.title"></h1>
        <div class="lang-switch" role="group" aria-label="Тил / Язык">
          <button type="button" data-lang="ru">RU</button>
          <button type="button" data-lang="ky">KY</button>
        </div>
      </div>
      <p class="muted" data-i18n="app.subtitle"></p>
      <label class="field">
        <span data-i18n="login.token"></span>
        <input id="login-token" type="password" autocomplete="current-password" required autofocus>
      </label>
      <p id="login-error" class="error" hidden></p>
      <button type="submit" class="btn btn--primary" data-i18n="login.signIn"></button>
    </form>
  </section>

  <!-- ============ Panel ============ -->
  <div id="panel-view" hidden>
    <header class="topbar">
      <h1 class="topbar__title"><span data-i18n="topbar.applications"></span> <span id="total-count" class="pill"></span></h1>

      <div class="demo-controls">
        <span class="demo-controls__label" data-i18n="demo.label"></span>
        <button type="button" class="btn" data-demo="reset" data-i18n="demo.reset" data-i18n-title="demo.resetHint"></button>
        <button type="button" class="btn" data-demo="clear" data-i18n="demo.clear" data-i18n-title="demo.clearHint"></button>
        <label class="switch" data-i18n-title="demo.failHint">
          <input id="fail-toggle" type="checkbox">
          <span data-i18n="demo.fail"></span>
        </label>
      </div>

      <div class="lang-switch" role="group" aria-label="Тил / Язык">
        <button type="button" data-lang="ru">RU</button>
        <button type="button" data-lang="ky">KY</button>
      </div>
      <button id="logout-btn" type="button" class="btn btn--ghost" data-i18n="topbar.logout"></button>
    </header>

    <div id="fail-banner" class="banner" data-i18n-html="demo.failBanner" hidden></div>

    <main class="content">
      <div class="toolbar">
        <input id="search" type="search" data-i18n-placeholder="toolbar.search">
        <select id="status-filter"></select>
        <button id="refresh-btn" type="button" class="btn" data-i18n="toolbar.refresh"></button>
        <button id="create-btn" type="button" class="btn btn--primary" data-i18n="toolbar.create"></button>
      </div>

      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th data-i18n="table.number"></th>
              <th data-i18n="table.service"></th>
              <th data-i18n="table.status"></th>
              <th data-i18n="table.explanation"></th>
              <th data-i18n="table.updated"></th>
              <th class="table__actions" data-i18n="table.actions"></th>
            </tr>
          </thead>
          <tbody id="apps-body"></tbody>
        </table>
        <p id="table-empty" class="table-empty" data-i18n="table.empty" hidden></p>
      </div>
    </main>
  </div>

  <!-- ============ Create / edit dialog ============ -->
  <dialog id="editor">
    <form id="editor-form" method="dialog" class="editor">
      <h2 id="editor-title"></h2>

      <label class="field">
        <span data-i18n="editor.number"></span>
        <input name="number" maxlength="32" data-i18n-placeholder="editor.numberPlaceholder">
      </label>
      <label class="field">
        <span data-i18n="editor.serviceRu"></span>
        <input name="service_name_ru" required maxlength="255">
      </label>
      <label class="field">
        <span data-i18n="editor.serviceKy"></span>
        <input name="service_name_ky" required maxlength="255">
      </label>

      <label class="field">
        <span data-i18n="editor.status"></span>
        <select name="status_select" id="status-select"></select>
      </label>
      <label class="field" id="custom-status-field" hidden>
        <span><span data-i18n="editor.customCode"></span> <small class="muted" data-i18n="editor.customHint"></small></span>
        <input name="status_custom" maxlength="32" placeholder="ON_HOLD">
      </label>

      <fieldset id="explanation-fields" class="field-group">
        <legend data-i18n="editor.explanationLegend"></legend>
        <p class="muted small" data-i18n="editor.explanationHint"></p>
        <label class="field">
          <span data-i18n="editor.explanationRu"></span>
          <textarea name="explanation_ru" rows="2" lang="ru"></textarea>
        </label>
        <label class="field">
          <span data-i18n="editor.explanationKy"></span>
          <textarea name="explanation_ky" rows="2" lang="ky"></textarea>
        </label>
      </fieldset>

      <p id="editor-error" class="error" hidden></p>

      <div class="editor__buttons">
        <button type="button" class="btn" id="editor-cancel" data-i18n="editor.cancel"></button>
        <button type="submit" class="btn btn--primary" id="editor-save" data-i18n="editor.save"></button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
